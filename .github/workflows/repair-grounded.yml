name: Publish universally evidence-gated agency analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-grounded.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    concurrency:
      group: policy-domino-pages-single-publisher
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Universal policy, source-evidence and browser regressions
        run: |
          python -m compileall -q v2 v3
          python -m unittest discover -s v2 -p 'test_*.py' -v
          python -m unittest discover -s v3 -p 'test_*.py' -v
          node site/test_adapter.cjs
      - name: Re-evaluate every stored official change with source evidence
        run: |
          python -m v3.repair_cached
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf8'))
          h=d['impact_health']
          assert h.get('evidence_gated') is True
          assert h['direct_actor_actions']==sum(
              len(x.get('institution_actions',[])) for x in d['events'])
          from v3.evidence_gate import is_repeal
          assert all(not x.get('institution_actions') for x in d['events']
                     if is_repeal(x))
          assert all(not x.get('dependency_actions') for x in d['events'])
          examined=set()
          verified_pairs=0
          for event in d['events']:
              for action in event.get('institution_actions',[]):
                  key=(event['id'],action['agency'],action['article'],action['work'])
                  assert key not in examined, f'Duplicate agency task: {key}'
                  examined.add(key)
                  if action.get('evidence_type')=='변경된 동일 조문 내 업무주체·의무문 확인':
                      assert action.get('change_pairs'), f'Unmatched sentence: {key}'
                      for pair in action['change_pairs']:
                          assert len(pair.get('before',''))>=13 or not pair.get('before')
                          assert len(pair.get('after',''))>=13 or not pair.get('after')
                          verified_pairs+=1
          print('PUBLISH_SEMANTIC',json.dumps({
              'unique_agency_tasks':len(examined),'complete_statement_pairs':verified_pairs,
              'documents':len(d['events'])},ensure_ascii=False))
          print('PUBLISH_EVIDENCE',json.dumps({
              'documents':len(d['events']),
              'repeals':h.get('repeal_events'),
              'sourced_actor_tasks':h['direct_actor_actions'],
              'verified_references':h['cross_policy_links']['links']
          },ensure_ascii=False))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy_pages
        uses: actions/deploy-pages@v4
