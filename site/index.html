<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정책도미노 | 정책변경이 실제 업무에 미치는 영향</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#203547;background:#f5f7f9;font-size:14px}*{box-sizing:border-box}
body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#17698b;text-decoration:none}a:hover{text-decoration:underline}
header{background:#0d2c42;color:#fff;padding:17px max(17px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:10px}
header strong{font-size:20px;letter-spacing:-.4px}header strong em{color:#90ded3;font-style:normal}header small{display:block;font-size:10px;letter-spacing:.12em;color:#a8c5d2;margin-top:2px}header a{color:#d7ebf1;font-size:12px;border:1px solid #5b7888;border-radius:8px;padding:7px}
main{max-width:1180px;margin:auto;padding:27px 16px 60px}
h1{font-size:29px;margin:8px 0 6px;letter-spacing:-.7px}h2{font-size:21px;margin:9px 0;letter-spacing:-.4px;line-height:1.5}h3{font-size:15px;margin:0 0 13px}
.intro{display:flex;align-items:start;justify-content:space-between;gap:15px;flex-wrap:wrap}
.intro .eyebrow{font-size:11px;color:#287596;font-weight:800;letter-spacing:.07em}.intro p{color:#75899a;font-size:13px;line-height:1.7;margin:0}
.refresh{border:1px solid #ccdbe4;background:#fff;padding:10px 13px;border-radius:9px;font-size:12px;font-weight:750;color:#275b76}
.health{border:1px solid #dce5ec;background:white;border-radius:10px;padding:12px 15px;margin:20px 0 15px;font-size:12px;line-height:1.7;color:#557085}
.health b{color:#1e596f}.health.warn{border-color:#ecd8bf;background:#fffcf7}.health.warn b{color:#a45b24}
.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px}.metric{border:1px solid #e1e8ec;background:white;border-radius:9px;padding:11px 14px;min-width:155px;flex:1}
.metric small{display:block;color:#768b99;font-size:11px}.metric b{display:block;font-size:20px;letter-spacing:-.3px;margin-top:4px}
.layout{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start}
.panel{background:#fff;border:1px solid #e1e8ee;border-radius:15px;overflow:hidden;min-width:0}.listHead{padding:17px 17px 13px;border-bottom:1px solid #edf0f2}
.listHead h3{font-size:18px;margin-bottom:4px}.explain{font-size:11px;color:#8293a0;line-height:1.6}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0}.chip{font-size:11px;font-weight:750;padding:7px 10px;border:1px solid #dbe5eb;background:white;border-radius:20px;color:#5c7787}.chip.active{background:#1c6688;border-color:#1c6688;color:white}
.search{width:100%;border:1px solid #dbe6ed;border-radius:8px;padding:10px 12px;font-size:12px;outline:none}.search:focus{border-color:#398eb0}
.count{margin-top:9px;color:#8496a1;font-size:11px}.list{max-height:79vh;overflow-y:auto}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #ebeff3;padding:16px 17px;background:white;cursor:pointer}
.item:hover{background:#f8fafb}.item.active{background:#edf7fb;border-left:4px solid #19779e;padding-left:13px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.tag{display:inline-block;background:#e8f3f8;color:#246680;font-size:10px;font-weight:820;padding:4px 7px;border-radius:5px}
.tag.good{background:#e3f3e8;color:#23704b}.tag.pending{background:#fbf1e6;color:#a2672d}.tag.muted{background:#eef1f3;color:#607684}
.date{font-size:11px;color:#8c9ca7}.itemTitle{font-weight:790;font-size:14px;line-height:1.55;margin:10px 0 6px;word-break:keep-all}
.itemSub{font-size:12px;color:#527486;line-height:1.55;overflow-wrap:anywhere}.itemMeta{font-size:11px;color:#8a9ba7;margin-top:9px;line-height:1.6}
.detail{min-height:530px}.detailHead{padding:23px 25px 18px;border-bottom:1px solid #e8eff3}.detailBody{padding:22px 25px}
.detailMeta{font-size:12px;color:#768b9b;line-height:1.7}.back{display:none;background:none;border:0;color:#216a88;font-weight:800;padding:0 0 12px}
.sec{margin-top:25px}.sec:first-child{margin-top:0}.secNote{font-size:12px;color:#758b9a;line-height:1.7;margin:-3px 0 12px}
.effect{border:1px solid #e0e8ed;border-radius:11px;margin-top:9px;overflow:hidden}
.effectHead{background:#f6f9fa;padding:10px 12px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.effectBody{display:grid;grid-template-columns:1fr 1fr}.effectSide{min-width:0;padding:12px 13px;overflow-wrap:anywhere}
.effectSide:first-child{background:#fffafa}.effectSide:last-child{background:#f8fdfb;border-left:1px solid #e4ebef}
.effectSide small{font-size:10px;font-weight:800;color:#70899a}.effectSide p{margin:7px 0;font-size:13px;line-height:1.65;font-weight:740;white-space:pre-wrap}
.effectContext{padding:10px 13px;font-size:11px;color:#697e8e;line-height:1.7;border-top:1px solid #e7ecef}
.card{border:1px solid #e1e8ed;border-radius:11px;padding:14px 15px;margin-top:10px}
.cardHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.agency{font-size:15px;font-weight:820;color:#243b4e}
.cardTitle{font-size:13px;font-weight:790;margin-top:12px}.cardText{font-size:12px;color:#516e7e;line-height:1.7;margin-top:6px;overflow-wrap:anywhere}
.cardFoot{font-size:11px;color:#8195a2;margin-top:9px;line-height:1.6}
.note{border:1px solid #e2eaf0;background:#f7fafb;border-radius:9px;padding:13px;font-size:12px;line-height:1.75;color:#617e8d}
.note.warning{border-color:#efdfc9;background:#fffaf4;color:#8d6337}
.candidate{font-size:12px;line-height:1.6;padding:10px;border-bottom:1px solid #e7edf0}
details{border:1px solid #e3ebef;border-radius:9px;padding:12px;margin-top:9px}summary{cursor:pointer;font-weight:790;font-size:12px}
.fullText{max-height:300px;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.75;color:#526d7e;padding:12px;background:#f7fafc;margin-top:10px;overflow-wrap:anywhere}
.foot{color:#8797a4;font-size:11px;text-align:center;margin-top:22px}
@media(max-width:810px){main{padding:20px 12px 48px}.layout{display:block}.detailPanel{display:none}.layout.open .listPanel{display:none}.layout.open .detailPanel{display:block}.back{display:block}.list{max-height:none}.detailHead{padding:18px}.detailBody{padding:18px}h1{font-size:25px}h2{font-size:19px}.metric{min-width:45%}.effectBody{grid-template-columns:1fr}.effectSide:last-child{border-left:0;border-top:1px solid #e4ebef}}
</style></head>
<body><header><div><strong>POLICY <em>DOMINO</em></strong><small>CHANGE → REAL IMPACT → AGENCY ACTION</small></div><a href="https://github.com/dodam-heo/policy-domino/actions" target="_blank" rel="noopener">수집 실행 기록</a></header>
<main>
<div class="intro"><div><span class="eyebrow">법령 문서 목록이 아닌 실제 정책 변화</span><h1>정책 변경과 기관별 영향</h1><p>공식 변경자료에서 실질적으로 바뀐 기준을 찾아 기관의 업무·규정·서비스에 미치는 영향을 추적합니다.</p></div><button class="refresh" id="refresh">↻ 새로고침</button></div>
<div class="health" id="health">공식 데이터와 분석 결과를 확인하고 있습니다.</div>
<div class="metrics" id="metrics"></div>
<div class="layout" id="layout">
<section class="panel listPanel"><div class="listHead"><h3>변경 사건</h3><div class="explain">실제 업무 변화가 확인된 사건을 우선 표시합니다. 원문 및 분석 대기 자료는 별도로 확인할 수 있습니다.</div>
<div class="filters" id="filters"><button class="chip active" data-kind="impact">실질 정책 변경</button><button class="chip" data-kind="followup">기관 추가 조사</button><button class="chip" data-kind="organization">조직·인사</button><button class="chip" data-kind="all">전체 자료</button></div>
<input class="search" id="search" placeholder="정책·업무·기관명 검색" aria-label="정책·업무·기관 검색"><div class="count" id="count"></div></div>
<div class="list" id="list"></div></section>
<section class="panel detailPanel"><div class="detail" id="detail"></div></section>
</div><div class="foot">기관 내부 시스템이나 조치 완료 여부는 공식 확인자료 없이 확정하지 않습니다.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url=x=>{try{const u=new URL(x);return ["http:","https:"].includes(u.protocol)?esc(u.href):"#"}catch(e){return "#"}};
let MODEL={events:[],groups:[],source_health:{},impact_health:{}},current="",mode="impact";
function actions(e){return [...(e.institution_actions||[]),...(e.dependency_actions||[])];}
function agenciesToReview(e){return [...actions(e),...(e.agency_candidates||[])];}
function isPolicy(e){return e.impact_category==="제도·업무 변경"&&(e.effects||[]).length>0;}
function groupChildren(){const children=new Set();for(const g of MODEL.groups||[])for(const c of g.linked_ids||[])children.add(c);return children;}
function cases(){
 const all=MODEL.events||[],child=groupChildren();
 const q=$("search").value.trim().toLowerCase();
 return all.filter(e=>{
  let show=false;
  if(mode==="impact")show=isPolicy(e);
  else if(mode==="followup")show=isPolicy(e)&&actions(e).length===0;
  else if(mode==="organization")show=e.impact_category==="조직·내부운영"||e.impact_category==="개별 행정처분";
  else show=true;
  if(!show)return false;
  if(mode!=="all"&&child.has(e.id))return false;
  return !q||[e.title,e.ministry,e.impact_category,
    ...(e.effects||[]).flatMap(x=>[x.context,x.old,x.new]),
    ...agenciesToReview(e).map(x=>x.agency)].join(" ").toLowerCase().includes(q);
 }).sort((a,b)=>(b.promulgated_at||"").localeCompare(a.promulgated_at||""));
}
function headline(e){
 const x=(e.effects||[])[0];
 if(!x)return "변경 내용 상세 검토 대기";
 const old=x.old||"신설",now=x.new||"삭제";
 return old+" → "+now;
}
function itemHTML(e){
 const a=agenciesToReview(e),selected=e.id===current;
 return '<button type="button" class="item '+(selected?'active':'')+'" data-event="'+esc(e.id)+'">'+
 '<div class="topline"><span class="tag '+(a.length?'good':'pending')+'">'+(a.length?'검토 기관 '+a.length+'건':'기관 추적 중')+'</span><span class="date">'+esc(e.promulgated_at||"날짜 미확인")+'</span></div>'+
 '<div class="itemTitle">'+esc(e.title)+'</div>'+
 '<div class="itemSub">'+esc(headline(e))+'</div>'+
 '<div class="itemMeta">'+esc(e.ministry||"소관 확인 필요")+' · '+esc(e.kind||"공식 규정")+' · '+esc(e.revision||"변경")+'</div></button>';
}
function renderList(){
 const rows=cases();$("count").textContent=rows.length+"개 사건 · 공포·발령일 최신순";
 $("list").innerHTML=rows.length?rows.map(itemHTML).join(""):'<div class="note" style="margin:16px">현재 조건에서 실제 변경과 기관을 함께 확인한 사건이 없습니다. 다른 분류의 분석 결과도 확인할 수 있습니다.</div>';
 $("list").querySelectorAll("[data-event]").forEach(b=>b.onclick=()=>choose(b.dataset.event));
}
function effectHTML(x){
 return '<div class="effect"><div class="effectHead"><span>'+esc(x.article||"공식 변경 조문")+'</span><span>'+esc((x.operations||[]).join(" · "))+'</span></div>'+
 '<div class="effectBody"><div class="effectSide"><small>변경 전</small><p>'+esc(x.old||"신규")+'</p></div><div class="effectSide"><small>변경 후</small><p>'+esc(x.new||"삭제")+'</p></div></div>'+
 '<div class="effectContext">관련 조문: '+esc(x.context||"원문 확인 필요")+'</div></div>';
}
function actionHTML(a){
 return '<div class="card"><div class="cardHead"><span class="agency">'+esc(a.agency||"기관 확인 필요")+'</span><span class="tag '+(a.evidence_type?"good":"pending")+'">'+esc(a.status||"검토 필요")+'</span></div>'+
 '<div class="cardFoot">'+esc(a.evidence_type||"연관 규정의 소관기관")+'</div>'+
 '<div class="cardTitle">'+esc(a.work||"업무 영향")+' · '+esc(a.target_location||"대상 업무 확인")+'</div>'+
 '<div class="cardText">'+esc(a.what_to_change||"변경 내용 검토")+'</div>'+
 '<div class="cardText">'+esc(a.required_change||"")+'</div>'+
 '<div class="cardFoot">'+esc(a.article||"관련 규정")+ ' · '+(a.verified_location===false||a.actual_system_verified===false?'개별 시스템 반영 상태 미확인':'공식 변경 근거')+'</div></div>';
}
function renderDetail(){
 const e=MODEL.events.find(x=>x.id===current);
 if(!e){$("detail").innerHTML='<div class="detailBody"><div class="note">왼쪽에서 정책 변경을 선택하면 변경된 기준과 기관별 검토사항을 확인할 수 있습니다.</div></div>';return}
 const effects=e.effects||[],a=agenciesToReview(e),more=e.agency_candidates||[],down=e.dependent_rules||[],group=(MODEL.groups||[]).find(g=>g.event_id===e.id);
 const linked=(group?.linked_ids||[]).map(id=>MODEL.events.find(x=>x.id===id)).filter(Boolean);
 const primary=e.institution_actions||[],secondary=e.dependency_actions||[];
 $("detail").innerHTML='<div class="detailHead"><button class="back" id="back">← 변경 목록</button>'+
 '<div class="tag">'+esc(e.source==="admrul"?"고시·행정규칙":"법령")+'</div>'+
 '<h2>'+esc(e.title)+'</h2><div class="detailMeta">'+esc(e.ministry||"소관 미확인")+' · '+esc(e.promulgated_at||"")+' 발령 · 시행일 '+esc(e.effective_date||"미확인")+'<br>'+esc(e.comparison_status||"대조 대기")+'</div></div>'+
 '<div class="detailBody">'+
 '<section class="sec"><h3>1. 실제로 무엇이 바뀌었나</h3>'+
 (effects.length?effects.slice(0,30).map(effectHTML).join(""):'<div class="note warning">수집된 원문에서 실제 변경값·조건을 충분히 확인하지 못했습니다. 변경을 임의 추정하지 않습니다.</div>')+'</section>'+
 '<section class="sec"><h3>2. 영향을 받는 기관과 검토할 일</h3><p class="secNote">변경 문서에 명시된 업무주체와, 관련 공식 규정에서 확인된 소관기관을 구분합니다.</p>'+
 (primary.length?primary.map(actionHTML).join(""):'')+
 (secondary.length?'<h3 style="margin-top:18px">연관 규정 소관기관 · 추가 검토</h3>'+secondary.map(actionHTML).join(""):'')+
 (a.length===0?'<div class="note warning">변경된 기준은 확인했지만 해당 업무의 실제 집행기관을 공식 근거로 특정하지 못했습니다. 임의의 기관명을 만들어 표시하지 않습니다.</div>':'')+
 (more.length?'<h3 style="margin-top:18px">소관기관 확인 · 집행기관 추가 조사</h3>'+more.map(actionHTML).join(""):'')+'</section>'+
 '<section class="sec"><h3>3. 연쇄적으로 영향을 받는 규정</h3>'+
 (down.length?down.map(x=>'<div class="card"><div class="cardHead"><b>'+esc(x.target_title)+'</b><span class="tag pending">'+esc(x.relation_level)+'</span></div>'+
 '<div class="cardText">'+esc(x.excerpt)+'</div><div class="cardFoot">'+esc(x.target_ministry)+' · 시스템 변경 여부 미확인</div>'+
 '<a href="'+url(x.target_url)+'" target="_blank" rel="noopener">해당 규정 원문 확인</a></div>').join(""):'<div class="note">이번 분석에서 공식 규정의 준용·적용 문맥을 확인한 하위규정은 아직 없습니다. 없다는 사실이 아닌 추가 탐색이 필요한 상태입니다.</div>')+
 (linked.length?'<h3 style="margin-top:16px">개정이유로 연결된 사건</h3>'+linked.map(x=>'<div class="candidate"><button data-related="'+esc(x.id)+'" class="chip">'+esc(x.title)+'</button></div>').join(""):'')+
 '<details><summary>추가로 조사할 문서 후보 '+(e.reference_candidates||[]).length+'건</summary><p class="secNote">단순 검색 후보는 연쇄 영향으로 확정하지 않았습니다.</p>'+
 (e.reference_candidates||[]).slice(0,30).map(x=>'<div class="candidate">'+esc(x.title)+' · '+esc(x.ministry)+' <a href="'+url(x.url)+'" target="_blank" rel="noopener">공식 원문</a></div>').join("")+'</details></section>'+
 '<section class="sec"><h3>4. 공식 변경 문서 및 검증 근거</h3><a href="'+url(e.url)+'" target="_blank" rel="noopener">국가법령정보센터에서 원문 보기 ↗</a>'+
 '<details><summary>전체 변경 조문 비교 펼치기</summary>'+
 (e.changes||[]).map(x=>'<div class="fullText">['+esc(x.article)+'] 변경 전\n'+esc(x.before||"없음")+'\n\n변경 후\n'+esc(x.after||"삭제")+'</div>').join("")+'</details></section></div>';
 $("back").onclick=()=>{$("layout").classList.remove("open");history.replaceState(null,"",location.pathname+location.search)};
 $("detail").querySelectorAll("[data-related]").forEach(x=>x.onclick=()=>choose(x.dataset.related));
}
function choose(id){current=id;$("layout").classList.add("open");history.replaceState(null,"","#event="+encodeURIComponent(id));renderList();renderDetail();if(innerWidth<=810)scrollTo({top:0,behavior:"smooth"})}
async function load(){
 try{
  const res=await fetch("./data.json?t="+Date.now(),{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);
  const data=await res.json();if(data.schema!=="policy-domino-impact-v3")throw Error("새 정책 영향 분석 결과가 배포되지 않았습니다.");
  MODEL=data;const h=data.impact_health||{},s=data.source_health||{};
  const errors=(s.errors||[]).length+(h.dependency_errors||[]).length;
  $("health").classList.toggle("warn",errors>0||s.partial);
  $("health").innerHTML='<b>공식 수집 '+esc(s.status||"진행")+'</b> · 법령 및 고시·행정규칙 최신 변경 수집'+
  '<div>신구 비교 완료 '+Number(h.verified_documents||0)+'건 · 실제 정책 기준 변화 '+Number(h.substantive_policy_events||0)+'건 · 업무주체 명시 조치 '+Number(h.direct_actor_actions||0)+'건</div>'+
  '<div>부분 수집·미검증 연결은 확정하지 않습니다. 추가 분석 대기 및 오류 '+errors+'건 · 생성 '+esc(data.generated_at||"미확인")+'</div>';
  $("metrics").innerHTML=[["실질 정책 변화",h.substantive_policy_events||0],["명시된 업무주체",h.direct_actor_actions||0],["연관 규정 확인",h.dependent_rules_found||0],["분석 문서",h.events||0]]
   .map(x=>'<div class="metric"><small>'+esc(x[0])+'</small><b>'+Number(x[1])+'</b></div>').join("");
  const hash=decodeURIComponent(location.hash.replace(/^#event=/,""));
  if(hash&&MODEL.events.some(x=>x.id===hash))current=hash;
  if(current&&!MODEL.events.some(x=>x.id===current))current="";
  const filtered=cases();if(!current&&innerWidth>810&&filtered.length)current=filtered[0].id;
  renderList();renderDetail();
 }catch(e){$("health").classList.add("warn");$("health").textContent="새 정책 영향 분석 결과를 불러오지 못했습니다. "+e.message;
  $("metrics").innerHTML="";$("list").innerHTML='<div class="note" style="margin:15px">검증되지 않은 결과를 대신 게시하지 않습니다.</div>';
  $("detail").innerHTML="";}
}
document.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{mode=b.dataset.kind;document.querySelectorAll("[data-kind]").forEach(x=>x.classList.toggle("active",x===b));current="";renderList();renderDetail();if(innerWidth>810&&cases().length){current=cases()[0].id;renderList();renderDetail();}});
$("search").oninput=renderList;$("refresh").onclick=load;load();
</script></body></html>
