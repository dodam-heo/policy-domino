name: Policy Domino Classic — Actionable Agency View
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/classic-publish.yml'
      - 'v4/classic_bridge.py'
      - 'v4/institutional_impact.py'
      - 'v4/test_institutional_impact.py'
      - 'site/classic/index.html'
      - 'site/index.html'
      - 'site/impact/index.html'
  workflow_dispatch:
  schedule:
    - cron: '47 0,6,12,18 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-classic-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Materialize newest official index entries without invented impact claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from v4.pipeline import recent_uninspected
          source=Path('site/v4/data.json')
          state=Path('data/v4_state.json')
          data=json.loads(source.read_text('utf8'))
          history=json.loads(state.read_text('utf8'))
          data['pending_index']=recent_uninspected(history)
          source.write_text(json.dumps(data,ensure_ascii=False,indent=2),'utf8')
          print('OFFICIAL_PENDING_VISIBLE',len(data['pending_index']))
          PY
      - name: Validate unseeded official institution discovery across policies
        run: python -m unittest -v v4.test_institutional_impact
      - name: Discover affected institutions from official public sources and rebuild grounded view
        run: python -m v4.classic_bridge
      - name: Verify complete V2 interface, source provenance and no invented compliance status
        run: node site/classic/test_ui.cjs
      - name: Commit latest Classic source-backed output
        run: |
          git config user.name policy-domino-classic-bot
          git config user.email policy-domino-classic-bot@users.noreply.github.com
          # Source-refresh jobs may update the same JSON concurrently.
          # Never rebase two generated JSON versions: refetch authoritative
          # HEAD and regenerate from its newest source state on each retry.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            python - <<'PY'
          import json
          from pathlib import Path
          from v4.pipeline import recent_uninspected
          p=Path('site/v4/data.json')
          d=json.loads(p.read_text('utf8'))
          state=json.loads(Path('data/v4_state.json').read_text('utf8'))
          d['pending_index']=recent_uninspected(state)
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),'utf8')
          PY
            python -m v4.classic_bridge
            node site/classic/test_ui.cjs
            git add site/v4/data.json site/classic/data.json site/impact/index.html
            if git diff --cached --quiet; then
              echo "Already up to date"
              break
            fi
            git commit -m 'data(classic): rebuild official index and evidence-first actions [skip ci]'
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 3
          done
  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Confirm both existing site and Classic actionable dashboard exist
        run: |
          test -s site/index.html
          test -s site/v4/index.html
          test -s site/classic/index.html
          test -s site/classic/data.json
          test -s site/impact/index.html
          node site/classic/test_ui.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy_pages
        uses: actions/deploy-pages@v4
