name: POLICY DOMINO automatic monitor and site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: policy-domino-deployment
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial project bundle
        run: |
          if [ -f deployment_bundle.b64 ]; then
            base64 --decode deployment_bundle.b64 > /tmp/policy-domino.zip
            unzip -o /tmp/policy-domino.zip -d .
            rm deployment_bundle.b64
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cloud dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan official sources and generate published dashboard
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python cloud_scan.py
      - name: Save source and monitoring history
        run: |
          git config user.name "policy-domino-bot"
          git config user.email "policy-domino-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update public policy monitoring sources and scan [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
