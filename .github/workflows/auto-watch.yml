name: Policy Domino - Monitor and Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'
      - 'data/state.json'
      - 'data/deploy_status.json'
      - 'data/collection_status.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-cloud
  cancel-in-progress: false
jobs:
  collect:
    name: Evidence-based cross-agency scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-document readers on cloud runner
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pypdf python-docx
      - name: Validate source modules and comparison rules
        run: |
          python -m compileall -q watch.py law_changes.py impact_scanner.py
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/policy-tests.log
      - name: Monitor changes and inspect downstream material
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python watch.py
      - name: Save verified monitoring results
        run: |
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: evidence-backed scan results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Record collection failure for diagnosis
        if: ${{ failure() }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          notes=Path("/tmp/policy-tests.log")
          text=notes.read_text(errors="replace") if notes.exists() else "Test log not available; see workflow run"
          # Unit-test diagnostics contain no source API keys or external request URLs.
          safe=text[-3500:] if notes.exists() else text
          payload={"checked_at":datetime.now(timezone.utc).isoformat(),
                   "status":"수집 또는 테스트 실패",
                   "test_output":safe}
          Path("data/collection_status.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add data/collection_status.json
          git commit -m 'ops: save collection diagnostic [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Publish user interface even if collection fails
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard JavaScript before publishing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!script)throw new Error('Dashboard script not found');
          new Function(script[1]);
          console.log('Dashboard JavaScript syntax valid');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful website deployment
        if: ${{ success() }}
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          payload={"deployed_at":datetime.now(timezone.utc).isoformat(),
                   "page_url":os.environ.get("LIVE_URL",""),
                   "commit":os.environ.get("GITHUB_SHA","")}
          Path("data/deploy_status.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2))
          PY
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add data/deploy_status.json
          git commit -m 'ops: record Pages deployment success [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
