name: Policy Domino - Monitor and Publish
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'
      - 'data/state.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-cloud
  cancel-in-progress: false
jobs:
  collect:
    name: Evidence-based cross-agency scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-document readers on cloud runner
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pypdf python-docx
      - name: Validate source modules and comparison rules
        run: |
          python -m compileall -q watch.py law_changes.py impact_scanner.py
          python -m unittest discover -s tests -v
      - name: Monitor changes and inspect downstream material
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python watch.py
      - name: Save verified monitoring results
        run: |
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add data/state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: evidence-backed scan results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  deploy:
    name: Publish user interface even if collection fails
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard JavaScript before publishing
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const script=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!script)throw new Error('Dashboard script not found');
          new Function(script[1]);
          console.log('Dashboard JavaScript syntax valid');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
