name: Policy Domino V2 — Official Source-wide Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '21 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'
      - 'data/v2_state.json'
      - 'data/v2_run_status.json'
      - 'data/v2_deploy_status.json'
      - 'data/next_state.json'
      - 'data/next_run_status.json'
      - 'data/next_deploy_status.json'
      - 'data/deploy_status.json'
      - 'data/collection_status.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-v2
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: github-pages
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify universal engine with cross-domain tests
        run: |
          python -m compileall -q v2
          python -m unittest discover -s v2 -p 'test_*.py' -v
      - name: Collect law and administrative-rule revisions
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        run: python v2/collector.py
      - name: Check data schema and collection coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf-8'))
          assert d['schema']=='policy-domino-v2'
          h=d['health']
          assert any(x['status']=='정상' for x in h['sources'].values()),'No official source available'
          print(json.dumps(h,ensure_ascii=False,indent=2)[:4000])
          PY
      - name: Commit verified data and status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf-8'))
          Path('data/v2_run_status.json').write_text(json.dumps({
            'completed_at':datetime.now(timezone.utc).isoformat(),
            'schema':d['schema'],
            'health':d.get('health',{})
          },ensure_ascii=False,indent=2),'utf-8')
          PY
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add site/data.json data/v2_state.json data/v2_run_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official v2 change evidence [skip ci]'
            git push origin HEAD:main
          fi

  deploy:
    needs: analyze
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate dashboard and published evidence
        run: |
          node - <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf-8');
          const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(!scripts.length)throw Error('Dashboard script missing');
          for(const s of scripts)new Function(s[1]);
          const data=JSON.parse(fs.readFileSync('site/data.json','utf-8'));
          if(data.schema!=='policy-domino-v2')throw Error('Not v2 data');
          console.log('Dashboard and collector schema verified');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy_pages
        uses: actions/deploy-pages@v4
