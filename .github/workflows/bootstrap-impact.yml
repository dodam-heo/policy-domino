name: Publish tested agency-first policy interface
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: policy-domino-pages-single-publisher
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual institution cards and all source data schemas
        run: |
          node site/test_adapter.cjs
          node - <<'JS'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('site/data.json','utf8'));
          if(!['policy-domino-v2','policy-domino-impact-v3'].includes(d.schema))
            throw Error('Unsupported official data model: '+d.schema);
          if(!(d.events||[]).length)throw Error('No official events');
          console.log('Deploying',d.schema,'events',d.events.length);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy_pages
        uses: actions/deploy-pages@v4
