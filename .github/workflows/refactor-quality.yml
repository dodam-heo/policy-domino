name: Policy Domino — Code Quality Gates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Domain and presentation regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned source annex reader
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python import and syntax validation
        run: python -m compileall -q policy_domino tests
      - name: Policy impact and route unit tests
        run: |
          python -m policy_domino.audit
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: End-to-end rebuild from persisted official evidence
        run: |
          python -m policy_domino --source stored
          node site/v4/test_ui.cjs
          node site/classic/test_ui.cjs
          node site/ai-impact/test_ui.cjs
      - name: Screen and source adapter contract tests
        run: |
          node site/classic/test_ui.cjs
