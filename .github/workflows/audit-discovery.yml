name: Audit pipeline coverage and policy visibility
on:
  push:
    branches: [fix/policy-discovery-priority-20261108]
    paths: ['v2/**','v3/**','site/**','.github/workflows/audit-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Unit tests on generalized source, impact, dependencies and agency UI
        run: |
          python -m compileall -q v2 v3
          python -m unittest discover -s v2 -p 'test_*.py' -v
          python -m unittest discover -s v3 -p 'test_*.py' -v
          node site/test_adapter.cjs
      - name: Audit collected annual changes and dashboard omissions
        run: python -m v3.audit_pipeline
      - name: Probe actual official annual rules and baseline comparisons
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
        run: python -m v3.probe_annual
