name: Policy Domino V4 — Verified Sources and Preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v4-progress.yml'
  schedule:
    - cron: '5 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-v4
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: V4 collection, causality, article/paragraph and viewer tests
        run: |
          python -m compileall -q v4
          python -m unittest discover -s v4 -p 'test_*.py' -v
          node site/v4/test_ui.cjs
      - name: Publish source-backed preview from staged verified records on first run
        if: github.event_name == 'push'
        run: python -m v4.stage_refresh
      - name: Incremental official source collection and evidence analysis
        if: github.event_name != 'push'
        env:
          LAW_OC: ${{ secrets.LAW_OC || vars.LAW_OC }}
          PD_V4_DETAILS: '20'
          PD_V4_DELEGATIONS: '5'
          PD_V4_SEARCH_PARENTS: '2'
          PD_V4_VERIFY_DEPENDENTS: '12'
        run: python -m v4.pipeline
      - name: Rebuild original V2-style agency impact view from newest official source
        run: |
          python -m v4.classic_bridge
          node site/classic/test_ui.cjs
      - name: Validate all published link claims and partial coverage labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/v4/data.json').read_text('utf8'))
          assert d['schema']=='policy-domino-v4'
          assert d['collection']['whole_corpus_complete'] is False
          assert d['collection']['official_catalogue']>=d['collection']['detailed_checked']
          assert d['status']=='PARTIAL'
          assert d['collection']['pending_details']>=0
          for group in d['featured_events']+d['other_events']:
              for edge in group['dependencies']:
                  assert edge['affected_verified']
                  assert edge['type'] in ('cited_changed_provision','formula_dependency')
                  assert edge['implementation_verified'] is False
              for doc in group['source_docs']:
                  if doc['comparison'] and doc['comparison']['kind']=='same_regulation_version':
                      assert doc['comparison']['same_stable_id']
          print('V4_PUBLISH_COVERAGE',json.dumps({
             'official_catalogue':d['collection']['official_catalogue'],
             'fresh_official_index':d['collection'].get('fresh_official_index'),
             'verified_detail_attempts':d['collection']['detailed_checked'],
             'pending':d['collection']['pending_details'],
             'featured':len(d['featured_events']),
             'verified_dependent_links':d['links']['confirmed_provision_or_formula_use'],
             'incomplete_windows':d['collection']['incomplete_windows'],
          },ensure_ascii=False))
          PY
      - name: Commit new official sources and result only after successful checks
        run: |
          git config user.name policy-domino-v4-bot
          git config user.email policy-domino-v4-bot@users.noreply.github.com
          git add data/v4_state.json site/v4/data.json site/classic/data.json site/impact/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'data(v4): advance official indexed sources and evidence [skip ci]'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = "3" ]; then exit 1; fi
              sleep 3
            done
          fi
  deploy:
    needs: update
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Verify site contains both old and new screens
        run: |
          test -s site/index.html
          test -s site/v4/index.html
          test -s site/classic/data.json
          test -s site/classic/index.html
          test -s site/impact/index.html
          node site/v4/test_ui.cjs
          python - <<'PY'
          import json
          d=json.load(open('site/v4/data.json',encoding='utf8'))
          assert d['schema']=='policy-domino-v4'
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy_pages
        uses: actions/deploy-pages@v4
