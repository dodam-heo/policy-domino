name: Policy Domino NEXT — Official Changes to Actions
on:
  workflow_dispatch:
  schedule:
    - cron: '21 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'site/data.json'
      - 'data/next_state.json'
      - 'data/next_run_status.json'
      - 'data/next_deploy_status.json'
      - 'data/deploy_status.json'
      - 'data/collection_status.json'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: policy-domino-next
  cancel-in-progress: false
jobs:
  analyze:
    name: Official legal changes & agency action generation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate new engine
        run: |
          python -m compileall -q next
          python -m unittest discover -s next -p 'test_*.py' -v
      - name: Analyze official legal versions (cloud only)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python next/engine.py
      - name: Publish evidence & execution record
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone
          p=Path('site/data.json')
          try:
              data=json.loads(p.read_text('utf-8'))
              status=(data.get('health') or {}).get('source_status','오류')
              compared=(data.get('health') or {}).get('compared',0)
              actions=len(data.get('actions',[]))
              message=(data.get('health') or {}).get('error')
          except Exception:
              status='분석 실패';compared=0;actions=0;message='실행 결과를 기록할 수 없습니다. Actions 로그 확인 필요.'
          out={'completed_at':datetime.now(timezone.utc).isoformat(),
               'source_status':status,'compared':compared,'actions':actions,'message':message}
          path=Path('data/next_run_status.json')
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf-8')
          PY
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add site/data.json data/next_run_status.json
          if [ -f data/next_state.json ]; then git add data/next_state.json; fi
          if ! git diff --cached --quiet; then
            git fetch origin main
            git reset --soft origin/main
            git add site/data.json data/next_run_status.json
            if [ -f data/next_state.json ]; then git add data/next_state.json; fi
            if ! git diff --cached --quiet; then
              git commit -m 'data: NEXT official law comparison results [skip ci]'
              git push origin HEAD:main
            fi
          fi

  deploy:
    name: Deploy freshly rebuilt interface
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify next dashboard and schema
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('site/index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!js) throw new Error('NEXT JavaScript missing');
          new Function(js[1]);
          const payload=JSON.parse(fs.readFileSync('site/data.json','utf8'));
          if(payload.schema!=='policy-domino-next-v1')throw new Error('Legacy schema must not be published');
          console.log('NEXT dashboard JS and data schema valid');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4
      - name: Record confirmed successful deployment
        if: success()
        env:
          LIVE_URL: ${{ steps.deploy_pages.outputs.page_url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          from datetime import datetime,timezone
          Path('data/next_deploy_status.json').write_text(json.dumps({
            'deployed_at':datetime.now(timezone.utc).isoformat(),
            'page_url':os.environ.get('LIVE_URL',''),
            'version':'policy-domino-next-v1',
            'commit':os.environ.get('GITHUB_SHA','')},ensure_ascii=False,indent=2),'utf-8')
          PY
          git config user.name 'policy-domino-bot'
          git config user.email 'policy-domino-bot@users.noreply.github.com'
          git add data/next_deploy_status.json
          git fetch origin main
          git reset --soft origin/main
          git add data/next_deploy_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'ops: NEXT Pages deployment confirmed [skip ci]'
            git push origin HEAD:main
          fi
