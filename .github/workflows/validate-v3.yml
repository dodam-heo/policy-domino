name: Verify Impact-First Redesign (No Deployment)
on:
  push:
    branches:
      - rebuild/impact-first-20261108
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and unit test revised impact logic
        run: |
          python -m compileall -q v2 v3
          python -m unittest discover -s v3 -p "test_*.py" -v
      - name: Check rebuilt engine against real collected official records
        env:
          PD_USE_EXISTING_RAW: "1"
          PD_SKIP_REMOTE_DEPENDENCIES: "1"
        run: |
          python -m v3.runner
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data.json").read_text("utf-8"))
          h=d["impact_health"]
          print(json.dumps(h,ensure_ascii=False,indent=2))
          for e in d["events"]:
            if e.get("effects") and e.get("impact_category")!="조직·인사":
              print("POLICY-SAMPLE",json.dumps({"title":e["title"],"ministry":e.get("ministry"),"effects":e["effects"][:2],"agency_candidates":e.get("agency_candidates",[])[:2]},ensure_ascii=False)[:1100])
          assert d["schema"]=="policy-domino-impact-v3"
          assert h["verified_documents"]>0
          assert h["substantive_policy_events"]>0
          assert h["agency_owners_to_verify"]+h["direct_actor_actions"]>0
          if h["direct_actor_actions"]==0:
            print("NOTICE: 현재 적재된 수집분의 법정 집행기관 직접 식별은 0건; 전수 결과 아님")
          PY
      - name: Verify real next-year administrative-rule discovery
        run: |
          python - <<'PY'
          from v2.collector import list_source
          rows=list_source("admrul",limit=40,title_query="2027")
          print("NEXT-YEAR-DISCOVERY",len(rows),[r["title"] for r in rows[:8]])
          assert rows,"다음 연도 행정규칙 이름검색 결과 없음"
          PY
      - name: Live end-to-end official source and operational impact smoke test
        env:
          PD_DETAIL_LIMIT: "16"
        run: |
          python -m v3.runner
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("site/data.json").read_text("utf-8"))
          h=d["impact_health"]
          source=d["source_health"]["sources"]
          print("LIVE-IMPACT",json.dumps({
            "sources":{k:v.get("status") for k,v in source.items() if k in ("law","admrul")},
            "impact":h,
            "sample_policy":[{"title":e["title"],"agencies":[x["agency"] for x in e.get("institution_actions",[])[:4]],
                              "candidate_agencies":[x["agency"] for x in e.get("agency_candidates",[])[:3]]}
                             for e in d["events"] if e.get("impact_category")=="제도·업무 변경"][:12]
          },ensure_ascii=False)[:6000])
          assert d["schema"]=="policy-domino-impact-v3"
          assert h["verified_documents"]>0
          assert any(v.get("status") in ("정상","부분") for k,v in source.items() if k in ("law","admrul"))
          PY
      - name: Verify impact-first interface JavaScript
        run: |
          node - <<'JS'
          const fs=require("fs");
          const html=fs.readFileSync("v3/index.html","utf8");
          const match=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!match)throw Error("Missing impact view script");
          new Function(match[1]);
          for(const text of ["영향을 받는 기관","실질 정책 변경","기관 추가 조사","변경 조문 비교"]){
            if(!html.includes(text))throw Error("Required impact-first section absent: "+text);
          }
          JS
