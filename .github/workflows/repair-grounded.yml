name: Publish universally evidence-gated agency analysis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-grounded.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Universal policy, source-evidence and browser regressions
        run: |
          python -m compileall -q v2 v3
          python -m unittest discover -s v2 -p 'test_*.py' -v
          python -m unittest discover -s v3 -p 'test_*.py' -v
          node site/test_adapter.cjs
      - name: Re-evaluate every stored official change with source evidence
        run: |
          python -m v3.repair_cached
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site/data.json').read_text('utf8'))
          h=d['impact_health']
          assert h.get('evidence_gated') is True
          assert h['direct_actor_actions']==sum(
              len(x.get('institution_actions',[])) for x in d['events'])
          assert all(not x.get('institution_actions') for x in d['events']
                     if '폐지' in x.get('revision',''))
          assert all(not x.get('dependency_actions') for x in d['events'])
          print('PUBLISH_EVIDENCE',json.dumps({
              'documents':len(d['events']),
              'repeals':h.get('repeal_events'),
              'sourced_actor_tasks':h['direct_actor_actions'],
              'verified_references':h['cross_policy_links']['links']
          },ensure_ascii=False))
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy_pages
        uses: actions/deploy-pages@v4
