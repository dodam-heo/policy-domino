name: Policy Domino — Official Policy Impact Pipeline

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'official = new official API records; stored = rebuild saved evidence'
        required: true
        default: official
        type: choice
        options: [official, stored]
      analyze_ai:
        description: 'Analyze ALL eligible policy events incrementally; reuse unchanged cached evidence results'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: policy-domino-publication
  cancel-in-progress: false

jobs:
  build:
    name: Collect, validate and publish policy evidence
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must not checkout the stale triggering commit after
          # an earlier serialized run has already published newer source data.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned source annex reader
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Guard single supported production pipeline
        run: python -m policy_domino.audit
      - name: Rebuild canonical output before checking presentation contracts
        run: python -m policy_domino --source stored
      - name: Validate production package, official adapters and V4 impact contracts
        run: |
          python -m compileall -q policy_domino tests
          python -m unittest discover -s tests -p 'test_*.py' -v
          node site/v4/test_ui.cjs
          node site/classic/test_ui.cjs
          node site/ai-impact/test_ui.cjs
      - name: Confirm official API client identifier
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == 'official') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-refresh-once]'))
        run: python -c "from policy_domino.official_api import official_oc; assert official_oc() == 'dori'"
      - name: Live official crawl and agency impact publication
        id: official_crawl
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.source == 'official') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-refresh-once]'))
        env:
          LAW_OC: dori
          PD_PUBLIC_SERVICE_KEY: ${{ secrets.PD_PUBLIC_SERVICE_KEY }}
          PD_PUBLIC_SERVICE_PAGES: ${{ vars.PD_PUBLIC_SERVICE_PAGES || '40' }}
          PD_PUBLIC_SERVICE_DETAILS: ${{ vars.PD_PUBLIC_SERVICE_DETAILS || '4000' }}
          PD_V4_DETAILS: ${{ vars.PD_V4_DETAILS || '120' }}
          PD_V4_RUN_BUDGET_SECONDS: ${{ vars.PD_V4_RUN_BUDGET_SECONDS || '1200' }}
          PD_HISTORY_DAYS: ${{ vars.PD_HISTORY_DAYS || '3650' }}
          PD_RETRY_WINDOWS_PER_RUN: ${{ vars.PD_RETRY_WINDOWS_PER_RUN || '2' }}
          PD_BACKFILL_WINDOWS_PER_RUN: ${{ vars.PD_BACKFILL_WINDOWS_PER_RUN || '2' }}
          PD_BACKFILL_WINDOW_DAYS: ${{ vars.PD_BACKFILL_WINDOW_DAYS || '28' }}
          PD_FETCH_OFFICIAL_ATTACHMENTS: ${{ vars.PD_FETCH_OFFICIAL_ATTACHMENTS || 'true' }}
          PD_V4_DELEGATIONS: '5'
          PD_V4_SEARCH_PARENTS: '4'
          PD_V4_VERIFY_DEPENDENTS: '24'
        run: python -m policy_domino --source official
      - name: Persist collection checkpoints even if official refresh fails
        if: failure() && steps.official_crawl.outcome == 'failure'
        run: |
          test -s data/v4_state.json || exit 0
          git config user.name policy-domino-bot
          git config user.email policy-domino-bot@users.noreply.github.com
          git add data/v4_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: preserve partial official crawl audit [skip ci]'
            git fetch origin main
            git rebase FETCH_HEAD
            git push origin HEAD:main
          fi
      - name: Rebuild agency impact from persisted official evidence
        if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[full-refresh-once]')) || (github.event_name == 'workflow_dispatch' && inputs.source == 'stored')
        run: python -m policy_domino --source stored
      - name: Incremental real LLM analysis for every verified policy event
        if: (github.event_name == 'schedule' && vars.PD_AI_AUTO_ENABLED != 'false') || (github.event_name == 'workflow_dispatch' && inputs.analyze_ai == true) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[ai-run-once]') || contains(github.event.head_commit.message, '[full-refresh-once]')))
        env:
          PD_LLM_API_KEY: ${{ secrets.PD_LLM_API_KEY }}
          PD_LLM_MODEL: ${{ vars.PD_LLM_MODEL }}
          PD_LLM_BASE_URL: ${{ vars.PD_LLM_BASE_URL || 'https://api.openai.com/v1' }}
          PD_LLM_FALLBACK_MODEL: ${{ vars.PD_LLM_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          PD_AI_PREFER_FALLBACK: ${{ vars.PD_AI_PREFER_FALLBACK || 'true' }}
          PD_AI_MAX_REQUESTS: ${{ vars.PD_AI_MAX_REQUESTS || '36' }}
          PD_AI_SUMMARY_REQUESTS: ${{ vars.PD_AI_SUMMARY_REQUESTS || '18' }}
          PD_AI_REQUEST_INTERVAL: ${{ vars.PD_AI_REQUEST_INTERVAL || '12' }}
        run: |
          if [ -z "$PD_LLM_API_KEY" ] || [ -z "$PD_LLM_MODEL" ]; then
            echo "::notice::AI model settings absent; official evidence still published without fabricated AI output."
          else
            python -m policy_domino.ai_impact --max-requests "$PD_AI_MAX_REQUESTS" --interval "$PD_AI_REQUEST_INTERVAL"
          fi
      - name: Validate generated public data and both user routes
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          node site/classic/test_ui.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          evidence=json.loads(Path('site/v4/data.json').read_text('utf-8'))
          view=json.loads(Path('site/classic/data.json').read_text('utf-8'))
          assert evidence['schema']=='policy-domino-v4'
          assert evidence['status']=='PARTIAL'
          assert view['schema']=='policy-domino-next-v1'
          assert view['events']
          assert all(e.get('source_verification') in (
              'verified_changed_clauses','verified_other','official_index_only',
              'detail_pending') for e in view['events'])
          assert all(e.get('impact_scope') for e in view['events'])
          assert all(not any(a['event_id']==e['event_id'] for a in view['actions'])
                     for e in view['events'] if e['source_verification']=='official_index_only')
          ai_file=Path('site/ai-impact/data.json')
          if ai_file.exists():
              ai=json.loads(ai_file.read_text('utf-8'))
              if ai['schema']=='policy-domino-llm-impact-v2':
                  assert len(ai['events'])==len(view['events'])
                  actions={a['id']:a for a in view['actions']}
                  source_events={e['event_id']:e for e in view['events']}
                  for e in ai['events']:
                      summary=e.get('source_summary')
                      if summary:
                          assert summary['source_fingerprint']==source_events[e['event_id']].get('source_fingerprint')
                      for finding in e['findings']:
                          official=actions[finding['action_id']]
                          assert official['event_id']==e['event_id']
                          assert official['evidence_scope'] in ('v4_verified_source', 'service_formula_dependency_verified', 'service_cited_changed_article_verified')
                          assert official['evidence_fingerprint']==finding['evidence_fingerprint']
                  print('AI_CATALOG_GATE',ai['total_events'],ai['total_analyzed_actions'],ai['status_counts'])
              else:
                  print('AI_LEGACY_FILE_PRESENT: awaiting conversion to v2 by next model run')
          print('PUBLICATION_GATE',len(view['events']),len(view['actions']))
          PY
      - name: Commit only source-backed generated outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name policy-domino-bot
          git config user.email policy-domino-bot@users.noreply.github.com
          base_sha=$(git rev-parse HEAD)
          git fetch origin main
          latest_sha=$(git rev-parse FETCH_HEAD)
          if [ "$base_sha" != "$latest_sha" ]; then
            echo "::error::main advanced during this run. Never rebase competing generated JSON files."
            echo "::notice::Queueing a fresh official scan on current main; old source files remain untouched."
            gh workflow run policy-domino.yml --ref main -f source=official -f analyze_ai=true
            exit 1
          fi
          git add data/v4_state.json site/v4/data.json site/classic/data.json site/classic/index.html site/impact/index.html
          if [ -f data/public_services.json ]; then git add data/public_services.json; fi
          if [ -f site/ai-impact/data.json ]; then git add site/ai-impact/data.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh official evidence and agency impacts [skip ci]'
            if ! git push origin HEAD:main; then
              git fetch origin main
              if [ "$(git rev-parse FETCH_HEAD)" != "$base_sha" ]; then
                echo "::warning::main advanced during publication; schedule a fresh run without discarding official source data."
                gh workflow run policy-domino.yml --ref main -f source=official -f analyze_ai=true
              else
                echo "::error::Push rejected although main did not advance. Check repository size and permissions; do not retry endlessly."
              fi
              exit 1
            fi
          fi

  deploy:
    name: Deploy the single verified GitHub Pages artifact
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live assets and high-impact entry route
        run: |
          test -s site/impact/index.html
          test -s site/classic/data.json
          test -s site/assets/impact-model.js
          node site/classic/test_ui.cjs
          node site/ai-impact/test_ui.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy_pages
        uses: actions/deploy-pages@v4
